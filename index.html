<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICET</title>
</head>
<body>

    <h1>Customer Manager</h1>
   
    <input type="text" placeholder="name" id="txtName">
    <input type="text" placeholder="age" id="txtAge">
    <input type="text" placeholder="address" id="txtAddress">
    <input type="text" placeholder="email" id="txtEmail">
    <input type="text" placeholder="salary" id="txtSalary">

    <!-- Added parentheses () to the function call -->
    <input type="button" value="add customer" onclick="btnAddCustomerOnAction()">

    <table border="1" id="tblCustomers">
        <tr>
            <td>Name</td>
            <td>Age</td>
            <td>Address</td>
            <td>Email</td>
            <td>Salary</td>
        </tr>
    </table>

    <input type="button" value="Load Table" onCle="loadTable";
    
    <script src="app.js"></script>
</body>
</html>
